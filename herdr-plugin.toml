# herdr-slurm-ops — interactive scheduler job control for herdr.
#
# Subcommands:
#   herdr-slurm-ops          (default) interactive ops TUI pane
#   herdr-slurm-ops open     open/focus the ops pane
#   herdr-slurm-ops refresh  one-shot snapshot to stdout
#   herdr-slurm-ops start    ensure the detached watcher daemon runs
#   herdr-slurm-ops stop     stop that daemon
#   herdr-slurm-ops daemon   foreground poll/notify loop (internal)
#
# Cluster config is READ from the herdr-slurm monitor plugin's machines.toml
# (`herdr plugin config-dir ivan.herdr-slurm`); there is no separate cluster
# list to keep in sync.

id = "ivan.herdr-slurm-ops"
name = "Scheduler Jobs Ops"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Interactive Slurm/PBS job control (cancel, hold, detail, follow) with opt-in per-job agent notification."
platforms = ["macos", "linux", "windows"]

[[build]]
command = ["cargo", "build", "--release"]

# Keep the watcher (terminal-state detection -> agent prompts, desktop
# notifications) alive without the ops pane. Idempotent.
[[startup]]
command = ["./target/release/herdr-slurm-ops", "start"]
platforms = ["linux", "macos"]

[[startup]]
command = [".\\target\\release\\herdr-slurm-ops.exe", "start"]
platforms = ["windows"]

[[panes]]
id = "ops"
title = "Scheduler Ops"
placement = "split"
command = ["./target/release/herdr-slurm-ops"]
platforms = ["linux", "macos"]

[[panes]]
id = "ops-windows"
title = "Scheduler Ops"
placement = "split"
command = [".\\target\\release\\herdr-slurm-ops.exe"]
platforms = ["windows"]

# One-shot snapshot, printed to the pane the action is invoked from.
[[actions]]
id = "refresh"
title = "Scheduler ops: snapshot"
contexts = ["workspace"]
command = ["./target/release/herdr-slurm-ops", "refresh"]
platforms = ["linux", "macos"]

[[actions]]
id = "refresh-windows"
title = "Scheduler ops: snapshot"
contexts = ["workspace"]
command = [".\\target\\release\\herdr-slurm-ops.exe", "refresh"]
platforms = ["windows"]

# Open (or focus) the interactive ops pane.
[[actions]]
id = "open"
title = "Scheduler ops: open pane"
contexts = ["workspace"]
command = ["./target/release/herdr-slurm-ops", "open"]
platforms = ["linux", "macos"]

[[actions]]
id = "open-windows"
title = "Scheduler ops: open pane"
contexts = ["workspace"]
command = [".\\target\\release\\herdr-slurm-ops.exe", "open"]
platforms = ["windows"]

# Stop the background watcher (it restarts with the next pane open or herdr
# launch). Agent notifications and failure alerts pause meanwhile.
[[actions]]
id = "stop"
title = "Scheduler ops: stop watcher"
contexts = ["workspace"]
command = ["./target/release/herdr-slurm-ops", "stop"]
platforms = ["linux", "macos"]

[[actions]]
id = "stop-windows"
title = "Scheduler ops: stop watcher"
contexts = ["workspace"]
command = [".\\target\\release\\herdr-slurm-ops.exe", "stop"]
platforms = ["windows"]
